# ProxyGridVPN client builds: tests, Windows installers and Android packages, uploaded as
# ProxyGridVPN-named artifacts. Apple builds need the Phu Duc signing identity and run locally (see
# docs/proxygridvpn/BUILD.md).
#
# Signing material only comes from repository secrets and is never written to the repo:
#   ANDROID_KEY_STORE_CONTENTS (base64 PKCS#12) + ANDROID_KEY_STORE_PASSWORD  -> signed release .aab/.apk
#   (Windows Authenticode signing is configured in electron/windows/electron_builder_signing_plugin.cjs)
# ProxyGrid sign-in identifiers come from repository variables (public values):
#   PROXYGRID_COGNITO_REGION, PROXYGRID_USER_POOL_ID, PROXYGRID_USER_POOL_CLIENT_ID
name: ProxyGridVPN / Builds

concurrency:
  group: '${{ github.ref }} ProxyGridVPN'
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/gridvpn-client
    tags:
      - 'proxygridvpn-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (for example 1.0.0); empty for a debug build'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: outline

env:
  VERSION_NAME: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/gridvpn-v') && github.ref_name) || '' }}
  PROXYGRID_COGNITO_REGION: ${{ vars.PROXYGRID_COGNITO_REGION }}
  PROXYGRID_USER_POOL_ID: ${{ vars.PROXYGRID_USER_POOL_ID }}
  PROXYGRID_USER_POOL_CLIENT_ID: ${{ vars.PROXYGRID_USER_POOL_CLIENT_ID }}

jobs:
  test:
    name: Web and Go tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: outline/.nvmrc
          cache: npm
          cache-dependency-path: ./outline/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ github.workspace }}/outline/go.mod'
      - run: npm ci
      - name: Web tests
        run: npm run action client/web/test
      - name: Go tests
        run: go test -race -count=1 ./client/go/...

  windows:
    name: Windows ${{ matrix.arch }}
    needs: test
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, arm64]
    steps:
      - run: git config --system core.longpaths true
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: outline/.nvmrc
          cache: npm
          cache-dependency-path: ./outline/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ github.workspace }}/outline/go.mod'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          use-cache: false
      - run: npm ci
      # The routing service and DNS-leak helper are rebuilt from source so their compiled-in
      # names (service ProxyGridVPNService, pipe ProxyGridVPNServicePipe, adapter proxygrid-tap0)
      # match the app and do not collide with an installed official Outline app.
      - name: Build Windows helpers (routing service, smartdnsblock)
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild client\electron\windows\OutlineService\OutlineService.sln /p:Configuration=Release /p:Platform=x86 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild client\electron\windows\smartdnsblock\smartdnsblock.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item client\electron\windows\OutlineService\OutlineService\bin\OutlineService.exe, client\electron\windows\smartdnsblock\bin\smartdnsblock.exe | Format-Table Name, Length, LastWriteTime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.arch == 'ia32'
        with:
          name: ProxyGridVPN-windows-helpers
          path: |
            outline/client/electron/windows/OutlineService/OutlineService/bin/OutlineService.exe
            outline/client/electron/windows/smartdnsblock/bin/smartdnsblock.exe
          if-no-files-found: error
      # The NSIS .exe installs the TAP driver and routing service. An MSI can be produced with
      # PROXYGRIDVPN_WINDOWS_MSI=1 but cannot connect yet (no TAP driver custom action).
      - name: Build installer (.exe)
        shell: bash
        run: |
          if [ -n "$VERSION_NAME" ]; then
            npm run action client/electron/build windows -- --arch ${{ matrix.arch }} \
              --buildMode=release --versionName="${VERSION_NAME#gridvpn-v}" \
              --autoUpdateUrl="${{ vars.PROXYGRIDVPN_UPDATE_URL || 'https://proxygrid.net/vpn/download/windows/' }}"
          else
            npm run action client/electron/build windows -- --arch ${{ matrix.arch }}
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ProxyGridVPN-windows-${{ matrix.arch }}
          path: outline/output/client/electron/build/*.exe
          if-no-files-found: error

  android:
    name: Android
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: outline/.nvmrc
          cache: npm
          cache-dependency-path: ./outline/package-lock.json
      - run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
      - run: npm ci
      - name: Build (.apk debug, or signed .aab + universal .apk for releases)
        env:
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_STORE_CONTENTS: ${{ secrets.ANDROID_KEY_STORE_CONTENTS }}
        run: |
          if [ -n "$VERSION_NAME" ] && [ -n "$ANDROID_KEY_STORE_CONTENTS" ]; then
            npm run action client/src/cordova/build android -- --buildMode=release \
              --versionName="${VERSION_NAME#gridvpn-v}" --buildNumber="${{ github.run_number }}"
          else
            npm run action client/src/cordova/build android -- --verbose
          fi
      - name: Rename artifacts
        run: |
          mkdir -p ../proxygridvpn-android
          find client/platforms/android -name '*.apk' -o -name '*.aab' -o -name '*.apks' | while read f; do
            cp "$f" "../proxygridvpn-android/ProxyGridVPN-$(basename "$f")"
          done
          ls -la ../proxygridvpn-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ProxyGridVPN-android
          path: proxygridvpn-android/*
          if-no-files-found: error
