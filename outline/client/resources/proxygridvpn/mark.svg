<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ProxyGridVPN app mark, matching the ProxyGrid website's VpnMark: VPN indigo square, the white
       ProxyGrid grid and an emerald exit node. Geometry is the website's 48-unit mark scaled to 1024. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6767DC"/>
      <stop offset="1" stop-color="#4F4FCB"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" stroke-opacity="0.92">
    <path d="M349 233V791M675 233V791M233 349H791M233 675H791"/>
  </g>
  <circle cx="675" cy="675" r="116" fill="#0E9F6E" stroke="#FFFFFF" stroke-width="51"/>
</svg>
